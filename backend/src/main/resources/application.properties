# LeadsPlus — backend
# Valores sensíveis vêm do arquivo backend/.env (não vai para o GitHub):
#   DB_URL, DB_USER, DB_PASSWORD, CRM_JWT_SEGREDO, CRM_CHAVE_CRIPTOGRAFIA,
#   ANTHROPIC_API_KEY, WHATSAPP_VERIFY_TOKEN, META_APP_SECRET ...

quarkus.http.port=3002
quarkus.rest.path=/api
quarkus.banner.enabled=false
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%m %U %s %D ms
# Arquivos enviados (mídia do chat, base de conhecimento) até 100 MB.
quarkus.http.limits.max-body-size=110M
# Atrás de proxy (Google Cloud / Cloudflare): usar o IP real do cliente.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true

# Banco PostgreSQL (local no desenvolvimento; Supabase/Cloud SQL em produção)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/gestao_crm}
quarkus.datasource.username=${DB_USER:gestao_crm}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.max-size=30
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Segurança
# Segredo dos tokens do login próprio do módulo (HS256, 32+ caracteres).
crm.jwt.segredo=${CRM_JWT_SEGREDO}
crm.jwt.validade-horas=12
# Chave AES (base64, 32 bytes) para guardar tokens do WhatsApp/Instagram e segredos criptografados.
crm.cripto.chave=${CRM_CHAVE_CRIPTOGRAFIA}
# Login integrado ao Cliente Plus: tokens do Supabase Auth (vazio = desligado).
crm.supabase.url=${SUPABASE_URL:}
# Origem do painel (CORS) em produção; no desenvolvimento o Vite faz proxy.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CRM_ORIGENS:http://localhost:5174}
quarkus.http.cors.headers=authorization,content-type,x-loja
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin

# Endereço público do sistema (links de propostas, agendamento, webhooks, mídia).
crm.url-publica=${CRM_URL_PUBLICA:http://localhost:5174}

# Arquivos enviados
crm.arquivos-dir=${CRM_ARQUIVOS_DIR:data/arquivos}

# IA (Claude)
crm.ia.chave=${ANTHROPIC_API_KEY:}
crm.ia.modelo-padrao=claude-opus-5-5
# Transcrição de áudio (o Claude não transcreve áudio): serviço compatível com Whisper.
crm.transcricao.url=${TRANSCRICAO_URL:}
crm.transcricao.chave=${TRANSCRICAO_CHAVE:}
crm.transcricao.modelo=${TRANSCRICAO_MODELO:whisper-1}

# WhatsApp Cloud API / Instagram (Meta)
crm.meta.graph-url=https://graph.facebook.com/v23.0
crm.meta.verify-token=${WHATSAPP_VERIFY_TOKEN:}
crm.meta.app-secret=${META_APP_SECRET:}
crm.meta.app-id=${META_APP_ID:}
crm.meta.config-id=${META_CONFIG_ID:}

# Importação dos dados do Meppy (pasta dados-meppy na raiz do projeto)
crm.importar-meppy=false
crm.meppy.pasta=../dados-meppy

%dev.quarkus.log.category."br.com.clienteplus".level=DEBUG

# E-mail do administrador da plataforma (acesso à Área de Admin)
crm.admin-email=${CRM_ADMIN_EMAIL:}
